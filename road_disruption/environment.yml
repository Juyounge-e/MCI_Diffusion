# 도로망 차단(road disruption) 실험 환경
#   conda env create -f road_disruption/environment.yml
#   conda activate road

name: road

channels:
  - conda-forge

dependencies:
  - python=3.12

  - pyosmium=4.3.1        
  - osmium-tool=1.19.1    

  - shapely>=2.0          
  - pyproj               
  - pyogrio              
  - geopandas

  - numpy
  - pandas
  - pyarrow
  - pyyaml
  - requests
  - tqdm
  - openpyxl              # MCI_ADV2 병원 데이터(엑셀 결합 데이터.xlsx) 읽기
  - folium                # 후보 도로 지도 시각화
